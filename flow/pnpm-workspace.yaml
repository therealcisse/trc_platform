packageManager: "pnpm@9.12.0"

packages:
  - chrome-extension
  - pages/*
  - packages/*
  - tests/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - edgedriver
  - esbuild
  - geckodriver
  - unrs-resolver

pnpm:
  overrides:
    # Require packages to be at least 1 day old (1440 minutes = 24 hours)
    minimumReleaseAge: 1440
    minimumReleaseAgeExclude:
      - '@eslint/*'
