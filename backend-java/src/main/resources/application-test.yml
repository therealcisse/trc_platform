spring:
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true

server:
  error:
    include-stacktrace: always

logging:
  level:
    root: WARN
  pattern:
    # Ensure exceptions print full stack traces in test logs
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n%wEx"

