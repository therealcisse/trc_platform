spring:
  jackson:
    parser:
      allow-backslash-escaping-any-character: true

  mvc:
    log-request-details: true

  application:
    name: trc-platform

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/trc_platform}
    username: ${DATABASE_USERNAME:trc_user}
    password: ${DATABASE_PASSWORD:trc_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 10000
      leak-detection-threshold: 20000
      connection-test-query: SELECT 1
      validation-timeout: 3000
      pool-name: TRCPlatformHikariCP
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        batch_versioned_data: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
server:
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always
    include-exception: true
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.trc.platform: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot: DEBUG
    org.springframework.boot.autoconfigure: DEBUG
    org.springframework.boot.autoconfigure.security: DEBUG
    org.springframework.security.authentication: DEBUG
    org.springframework.security.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.zaxxer.hikari: DEBUG
    com.zaxxer.hikari.pool: DEBUG
    com.zaxxer.hikari.HikariConfig: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

openai:
  api:
    key: ${OPENAI_API_KEY:}
    url: https://api.openai.com/v1/chat/completions

security:
  jwt:
    # Base64-encoded 256-bit key. For example: export JWT_SECRET=$(openssl rand -base64 32)
    secret: ${JWT_SECRET:VGhpcy1pcy1hLXN1cGVyLXNlY3JldC1kZXYta2V5LWFkYXB0LW1lIQ==}
    ttl-hours: ${JWT_TTL_HOURS:24}

email:
  verification:
    # Secret key for email verification JWT tokens (must be at least 32 characters)
    secret: ${EMAIL_VERIFICATION_SECRET:your-super-secure-256-bit-secret-key-for-email-verification-32}
