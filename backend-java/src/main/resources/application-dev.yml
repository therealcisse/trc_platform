spring:
  mail:
    host: localhost
    port: 1025
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
        transport:
          protocol: smtp
    from: test@trc-platform.local

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:5173"

server:
  error:
    include-stacktrace: always
    include-message: always
    include-binding-errors: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n%wEx"
