[package]
name = "trc-platform"
version = "0.1.0"
edition = "2021"
authors = ["TRC Platform Team"]
description = "TRC Platform Backend - High-performance Rust implementation"

[workspace]
members = [".", "."]  # Single package workspace for future expansion

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros", "tracing"] }
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-br"] }
hyper = { version = "1.0", features = ["full"] }

# Database
sqlx = { version = "0.8", features = [
    "postgres",
    "runtime-tokio-rustls",
    "uuid",
    "chrono",
    "json",
    "migrate"
] }

# Authentication & Security
jsonwebtoken = { version = "10.1", features = ["use_pem", "rust_crypto"] }
tower-oauth2-resource-server = "0.4"
argon2 = "0.5"
ring = "0.17"

# HTTP Client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Caching
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.26", features = ["tokio-comp", "connection-manager"] }

# API Documentation
utoipa = { version = "5.4", features = ["axum_extras", "openapi_extensions"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Configuration
figment = { version = "0.10", features = ["env", "toml", "json"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Async Runtime
tokio = { version = "1.48", features = ["full"] }

# Async traits
async-trait = "0.1"

# Logging & Monitoring
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.32"
opentelemetry = "0.26"
opentelemetry-otlp = "0.31"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
once_cell = "1.20"
futures = "0.3"

# Email
lettre = "0.11"

# Domain validation
email_address = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.0"
sqlx-cli = { version = "0.8", features = ["postgres"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
debug = true