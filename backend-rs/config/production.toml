# TRC Platform - Production Environment Configuration
# This file contains configuration optimized for production deployment
# These settings override the defaults in default.toml

[server]
# Production server settings
host = "0.0.0.0"  # Bind to all interfaces
port = 8080
workers = null  # Auto-detect based on CPU cores
request_timeout_ms = 30000
keep_alive = 30

[database]
# Production database - configure via environment variables
# url should be set via TRC_DATABASE__URL environment variable
max_connections = 20
min_connections = 5
acquire_timeout_seconds = 10
idle_timeout_seconds = 300
max_lifetime_seconds = 3600

[openai]
# Production OpenAI settings
# api_key should be set via TRC_OPENAI__API_KEY environment variable
model = "gpt-4.1-mini-2025-04-14"
timeout_seconds = 60
max_retries = 3

[jwt]
# Production JWT settings
# secret should be set via TRC_JWT__SECRET environment variable (must be strong)
ttl_hours = 24
refresh_ttl_days = 30
issuer = "trc-platform"

[email]
# Production email settings
# smtp_username and smtp_password should be set via environment variables
from_address = "noreply@trcplatform.com"
from_name = "TRC Platform"
smtp_host = ""  # Set via TRC_EMAIL__SMTP_HOST
smtp_port = 587
use_tls = true

[cache]
# Production Redis settings
# redis_url should be set via TRC_CACHE__REDIS_URL environment variable
default_ttl_seconds = 3600
max_connections = 20

[logging]
# Production logging settings
level = "info"
format = "json"  # Structured JSON logs for log aggregation
output = "stdout"

# Production log targets
targets = ["trc_platform", "tower_http"]

[cors]
# Restrictive CORS for production
allow_origins = []  # Configure via environment variable TRC_CORS__ALLOW_ORIGINS
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["Content-Type", "Authorization", "X-Requested-With"]
expose_headers = []
allow_credentials = true
max_age_seconds = 3600

[monitoring]
# Enable full monitoring in production
enable_metrics = true
metrics_port = 9090
enable_tracing = true
tracing_endpoint = ""  # Set via TRC_MONITORING__TRACING_ENDPOINT

[features]
# Production feature flags
enable_registration = true
enable_email_verification = true
enable_password_reset = true
enable_api_tokens = true
enable_billing = true
enable_admin_panel = true

[security]
# Strict security settings for production
password_min_length = 12
require_special_chars = true
session_timeout_minutes = 30
max_login_attempts = 5
lockout_duration_minutes = 30
rate_limit_requests_per_minute = 100

[limits]
# Production limits
max_api_tokens_per_user = 10
max_requests_per_minute = 1000
max_file_upload_size_mb = 10
max_concurrent_requests = 100

# Production-specific settings
[production]
# Performance and reliability optimizations
enable_request_compression = true
enable_response_compression = true
connection_draining_timeout_seconds = 30
graceful_shutdown_timeout_seconds = 60
health_check_interval_seconds = 30

# Security headers
[production.security_headers]
# Security headers for production
strict_transport_security = "max-age=31536000; includeSubDomains"
content_type_options = "nosniff"
frame_options = "DENY"
xss_protection = "1; mode=block"
referrer_policy = "strict-origin-when-cross-origin"