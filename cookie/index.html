<html>
  <body>
    <script defer src="popup.js" type="module"></script>
    <h2>Cookie Cleaner</h1>
    <hr />
    <div style="min-width: 300px;">
      <button id="on-off" style="background-color: lightgreen;">Enable</button>
      <span style="border-right: 2px solid black;">&nbsp;</span>
      <input id="people" type="checkbox" value="1" style="vertical-align: middle;">Voll</input>
      <span style="border-right: 2px solid black;">&nbsp;</span>
      <input id="animals" type="checkbox" value="1" style="vertical-align: middle;">Tier</input>
      <span style="border-right: 2px solid black;">&nbsp;</span>
      <input id="cancer" type="checkbox" value="1" style="vertical-align: middle;">Krebs</input>
      <br/><hr />
      <h4>Timers</h4>
      <span style="display:inline-block;min-width: 40px;">Tier:</span>
      <input id="animals-timer-min" type="text" min="1" max="50" value="1" style="vertical-align: middle;width: 30px;"></input>
      -
      <input id="animals-timer-max" type="text" min="1" max="50" value="2" style="vertical-align: middle;width: 30px;"></input> seconds
      <br />
      <span style="display:inline-block;min-width: 40px;">Voll:</span>
      <input id="people-timer-min" type="text" min="1" max="50" value="1" style="vertical-align: middle;width: 30px;"></input>
      -
      <input id="people-timer-max" type="text" min="1" max="50" value="2" style="vertical-align: middle;width: 30px;"></input> seconds
      <br/>
      <span style="display:inline-block;min-width: 40px;">Krebs:</span>
      <input id="cancer-timer-min" type="text" min="1" max="50" value="4" style="vertical-align: middle;width: 30px;"></input>
      -
      <input id="cancer-timer-max" type="text" min="1" max="50" value="7" style="vertical-align: middle;width: 30px;"></input> seconds
      <br/>
      <hr />
      <button id="logs">Logs</button> <button id="remove-logs">Remove Logs</button>
      <hr />
      <span style="display:inline-block;min-width: 40px;">Watch Timer Page:</span>
      <button id="watch">-</button>
      <hr />
      <span style="display:inline-block;min-width: 40px;">Operation Hours:</span>
      <br />
      <div>
        <input id="operation-hours-1-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Monday: </span></input>
        <input id="operation-hours-1-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-1-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
        <input id="operation-hours-2-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Tuesday: </span></input>
        <input id="operation-hours-2-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-2-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
        <input id="operation-hours-3-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Wednesday: </span></input>
        <input id="operation-hours-3-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-3-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
        <input id="operation-hours-4-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Thursday: </span></input>
        <input id="operation-hours-4-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-4-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
        <input id="operation-hours-5-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Friday: </span></input>
        <input id="operation-hours-5-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-5-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
        <input id="operation-hours-6-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Saturday: </span></input>
        <input id="operation-hours-6-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-6-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
        <input id="operation-hours-0-enabled" type="checkbox" checked style="vertical-align: middle;width: 30px;"><span style="display: inline-block; width: 100px;">Sunday: </span></input>
        <input id="operation-hours-0-min" type="text" min="1" max="24" value="8" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="operation-hours-0-max" type="text" min="1" max="24" value="20" style="vertical-align: middle;width: 30px;"></input>
        <br />
      </div>
      <hr />
      <div>
        <input id="email-mode" type="checkbox" checked value="1" style="vertical-align: middle;">Email Mode</input>
        <span style="display:inline-block;min-width: 40px;"> | Refresh (seconds):</span>
        <input id="email-refresh-min" type="text" min="1" max="9999" value="2" style="vertical-align: middle;width: 30px;"></input>
        -
        <input id="email-refresh-max" type="text" min="1" max="9999" value="2" style="vertical-align: middle;width: 30px;"></input>
      </div>
    </div>
  </body>
</html>
