services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: trc_user
      POSTGRES_DB: trc_platform
      POSTGRES_PASSWORD: trc_password
      POSTGRES_HOST_AUTH_METHOD: trust  # Enables passwordless access
    ports:
      - "5432:5432"
    volumes:
      - trc_pg:/var/lib/postgresql/data
    networks:
      - app-network

  adminer:
    image: adminer:latest
    environment:
      ADMINER_DESIGN: hever
    ports:
      - "8090:8080"
    networks:
      - app-network
    depends_on:
      - db

  # app:
  #   build: .
  #   environment:
  #     DATABASE_URL: jdbc:postgresql://db:5432/trc_platform
  #     DATABASE_USERNAME: trc_user
  #     DATABASE_PASSWORD: ""  # Set to empty if uncommenting this service
  #     OPENAI_API_KEY: ${OPENAI_API_KEY}
  #     CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
  #     SPRING_PROFILES_ACTIVE: prod
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     - db

  mailcatcher:
    image: stpaquet/alpinemailcatcher
    ports:
      - "1080:1080" # Web UI to view emails
      - "1025:1025" # SMTP server port
    environment:
      - MAIL_LIMIT=200
      - TIMEZONE=Europe/Berlin

volumes:
  trc_pg: {}

networks:
  app-network:
    driver: bridge
