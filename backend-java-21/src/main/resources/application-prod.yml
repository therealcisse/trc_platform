spring:
  profiles:
    include: prod
  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp
    from: ${EMAIL_FROM:noreply@trc-platform.com}

cors:
  allowed-origins:
    - "https://app.trc-platform.com"
    - "https://admin.trc-platform.com"

